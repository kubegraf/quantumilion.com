  <path d="M12 2.6 21.4 12 12 21.4 2.6 12 12 2.6Z" stroke="#0A0B0D" stroke-width="1.4" stroke-linejoin="round" opacity=".85"/>
  <g stroke="#0A0B0D" stroke-width="1.1" opacity=".42"><path d="M12 4.6v14.8M4.6 12h14.8"/></g>
  <g fill="#FFFFFF" stroke="#0A0B0D" stroke-width="1.3">
    <circle cx="12" cy="2.6" r="1.7"/><circle cx="21.4" cy="12" r="1.7"/>
    <circle cx="12" cy="21.4" r="1.7"/><circle cx="2.6" cy="12" r="1.7"/>
  </g>
  <circle cx="12" cy="12" r="3.1" fill="#0A6E88"/>
  <path d="m14.9 14.9 4.6 4.6" stroke="#0A6E88" stroke-width="2" stroke-linecap="round"/>
</svg>
